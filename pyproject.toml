[project]
name = "shortcut-groups"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
experiments = [
    "lightning",
    "lxt",
    "matplotlib",
    "monai",
    "pandas",
    "pillow",
    "scikit-image",
    "scipy",
    "timm",
    "timm-3d",
    "torch",
    "torchmetrics",
    "torchvision",
    "tqdm",
    "zennit",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shortcut_groups*", "exps*", "plots*"]
